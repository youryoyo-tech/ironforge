name: Fix GitHub Pages paths
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix project paths safely
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          prefix='/ironforge'
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in {'.html','.js','.css','.txt'}: continue
              try: s=p.read_text(encoding='utf-8')
              except Exception: continue
              old=s
              s=re.sub(r'(["\'])/assets/', r'\1'+prefix+'/assets/', s)
              s=re.sub(r'(["\'])/favicon\.ico', r'\1'+prefix+'/favicon.ico', s)
              for route in ['about','membership','trainers','classes','schedule','gallery','contact','faq']:
                  s=s.replace(f'href="/{route}', f'href="{prefix}/{route}')
                  s=s.replace(f"href='/{route}", f"href='{prefix}/{route}")
              s=s.replace('href="/"','href="'+prefix+'/"')
              if p.suffix.lower()=='.js':
                  s=re.sub(r'(["\'])assets/', r'\1'+prefix+'/assets/', s)
                  s=s.replace('basepath:``','basepath:`'+prefix+'`').replace('basepath:""','basepath:"'+prefix+'"')
              if p.suffix.lower()=='.html' and 'class="reveal' in s:
                  s=s.replace('</head>','<style>.reveal{opacity:1!important;transform:none!important;visibility:visible!important}</style></head>',1)
              if s!=old: p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then git commit -m 'Fix GitHub Pages rendering'; git push; fi
